[build]
  command = "echo 'Static frontend; no build step required'"
  publish = "web"

[[redirects]]
  from = "/api/*"
  to = "https://dentsu-mini-bot-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://dentsu-mini-bot-production.up.railway.app/health"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://dentsu-mini-bot-production.up.railway.app/assets/:splat"
  status = 200
  force = true